name: iOS build (IRIS on iPhone, #194511)

# The iPhone build of packages/desktop: the same interface, no engine sidecar (iOS will not run
# one), connected to an engine on one of the person's own machines. This job builds it for the
# iOS Simulator, unsigned, launches it and keeps a screenshot. The signed TestFlight lane comes
# once the App Store Connect key and app record exist (epic #194511).
#
# Push-triggered on the work branches because a workflow_dispatch workflow cannot be started from
# a branch until the file is on main.
on:
  push:
    branches: ["wt/194511-**"]
    paths:
      - ".github/workflows/ios-build.yml"
      - "packages/desktop/**"
      - "packages/app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Install Rust stable (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: ios-sim
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/wt/194511-') }}

      - name: Toolchain
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen

      - name: Generate the Xcode project
        working-directory: packages/desktop
        run: ./node_modules/.bin/tauri ios init --ci

      # The repo's iOS icon set, with the alpha channel flattened: App Store Connect refuses an app
      # icon that has one.
      - name: App icon
        working-directory: packages/desktop/src-tauri
        run: |
          set -euo pipefail
          SET=$(find gen/apple -type d -name AppIcon.appiconset | head -1)
          cp icons/prod/ios/*.png "$SET"/
          for f in "$SET"/*.png; do
            sips -s format jpeg "$f" --out "$RUNNER_TEMP/flat.jpg" >/dev/null
            sips -s format png "$RUNNER_TEMP/flat.jpg" --out "$f" >/dev/null
          done
          sips -g hasAlpha "$SET/AppIcon-512@2x.png"

      - name: Build the interface
        working-directory: packages/desktop
        run: bun run build

      - name: Build for the Simulator
        # Through `tauri ios build`, not xcodebuild: the project's "Build Rust Code" phase calls back
        # into the tauri CLI that started it, and fails when nothing did. The interface is already
        # built (step above), so beforeBuildCommand is skipped.
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/ios-build.log"
          if ! ./node_modules/.bin/tauri ios build --target aarch64-sim --debug --ci \
               --config '{"build":{"beforeBuildCommand":""}}' > "$LOG" 2>&1; then
            grep -nE 'error(\[E[0-9]+\])?:|error:|Error:|failed|panicked' "$LOG" | head -80
            echo "----- last 120 lines -----"; tail -120 "$LOG"
            exit 1
          fi
          tail -30 "$LOG"
          APP=$(find src-tauri/gen/apple/build src-tauri/target "$HOME/Library/Developer/Xcode/DerivedData" -name '*.app' -path '*simulator*' -maxdepth 8 2>/dev/null | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple/build -name '*.app' -maxdepth 6 | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"

      - name: Launch in the Simulator and take a screenshot
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone 1[5-7]( Pro)?$"))][0].udid')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 20
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/shots/connect.png"
          # Still running 20 s after launch = it did not crash on start.
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i "$BUNDLE"

      - name: Upload screenshot and app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/shots/
          if-no-files-found: warn

  # Signed build → App Store Connect → TestFlight. Runs only when asked: a manual run, or a push
  # whose commit message contains [testflight]. Needs, as repository secrets:
  #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (an App Store Connect API key with the Admin role, so
  #   Xcode can create the distribution certificate and profile itself), and APPLE_TEAM_ID.
  # And an app record for io.heyiris.app in App Store Connect, which only a person can create.
  testflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    needs: simulator
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Secrets present
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: ios-device
          save-if: ${{ startsWith(github.ref, 'refs/heads/wt/194511-') }}
      - run: command -v xcodegen || brew install xcodegen
      - name: Generate the Xcode project
        working-directory: packages/desktop
        run: ./node_modules/.bin/tauri ios init --ci
      - name: App icon
        working-directory: packages/desktop/src-tauri
        run: |
          set -euo pipefail
          SET=$(find gen/apple -type d -name AppIcon.appiconset | head -1)
          cp icons/prod/ios/*.png "$SET"/
          for f in "$SET"/*.png; do
            sips -s format jpeg "$f" --out "$RUNNER_TEMP/flat.jpg" >/dev/null
            sips -s format png "$RUNNER_TEMP/flat.jpg" --out "$f" >/dev/null
          done
      - name: Build the interface
        working-directory: packages/desktop
        run: bun run build
      - name: Archive and upload to TestFlight
        working-directory: packages/desktop/src-tauri
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          PROJ=$(ls -d gen/apple/*.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | jq -r '.project.schemes[] | select(endswith("_iOS"))' | head -1)
          # Every upload needs a new build number; the run number only goes up.
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/IRIS.xcarchive" \
            ARCHS=arm64 DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" archive | tail -60
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/IRIS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          rm -f "$KEY"
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing (usually 5–20 minutes)."

  # The desktop app must not notice: the same commit still compiles for macOS.
  desktop-still-compiles:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: desktop-test-aarch64
          save-if: false
      - name: Frontend builds (typecheck + vite)
        working-directory: packages/desktop
        run: bun run build
      # tauri-build checks that every externalBin exists; a stub stands in for the engine.
      - name: cargo check (macOS)
        working-directory: packages/desktop/src-tauri
        run: |
          mkdir -p sidecars && touch sidecars/iris-cli-aarch64-apple-darwin sidecars/iris-mic-aarch64-apple-darwin
          cargo check --locked --target aarch64-apple-darwin
          cargo test --locked --target aarch64-apple-darwin --no-run
