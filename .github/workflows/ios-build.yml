name: iOS build (IRIS on iPhone, #194511)

# The iPhone build of packages/desktop: the same interface, no engine sidecar (iOS will not run
# one), connected to an engine on one of the person's own machines. This job builds it for the
# iOS Simulator, unsigned, launches it and keeps a screenshot. The signed TestFlight lane comes
# once the App Store Connect key and app record exist (epic #194511).
#
# Push-triggered on the work branches because a workflow_dispatch workflow cannot be started from
# a branch until the file is on main.
on:
  push:
    branches: ["wt/194511-**", "wt/194555-**"]
    paths:
      - ".github/workflows/ios-build.yml"
      - "packages/desktop/**"
      - "packages/app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      # The phone's conversation with the platform (#194511): the send-code payload against the
      # one Desktop ships, the HTTP plugin's JS and Rust halves on one release, reply parsing, and
      # read-only checks against production. Each test is a TestFlight build that failed first.
      - name: Phone platform tests (live)
        working-directory: packages/desktop
        env:
          IRIS_LIVE: "1"
        run: bun test src/mobile-platform.test.ts

      # A new device starts with the folders of the server's recent chats (#194511, seed-projects.ts).
      - name: Interface tests the phone depends on
        working-directory: packages/app
        run: bun test src/context/seed-projects.test.ts

      - name: Install Rust stable (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: ios-sim
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/wt/194511-') || startsWith(github.ref, 'refs/heads/wt/194555-') }}

      - name: Toolchain
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen

      - name: Generate the Xcode project
        working-directory: packages/desktop
        run: bun run tauri ios init --ci

      # Sign in with Apple (#194555, guideline 4.8) needs com.apple.developer.applesignin = [Default]
      # in the app's entitlements. `tauri ios init` generates the iOS target's .entitlements file
      # (and points CODE_SIGN_ENTITLEMENTS at it); the key is added to that file here, because gen/
      # is regenerated on every run. Signing: the CI App Store Connect key has the Admin role and
      # tauri signs automatically with it, which is expected to turn the Sign in with Apple capability
      # on for App ID io.heyiris.app when the profile is made. If it does not, it is one checkbox in
      # the developer portal (Identifiers → io.heyiris.app → Sign in with Apple; handoff #194546).
      - name: Sign in with Apple entitlement
        working-directory: packages/desktop/src-tauri
        run: |
          set -euo pipefail
          find gen/apple -name '*.entitlements' -not -path '*/build/*'
          ENT=$(find gen/apple -name '*.entitlements' -not -path '*/build/*' | head -1)
          if [ -z "$ENT" ]; then
            echo "::error::tauri ios init made no .entitlements file; create it and set CODE_SIGN_ENTITLEMENTS"
            ls -R gen/apple | head -60; exit 1
          fi
          grep -rn "$(basename "$ENT")" gen/apple/project.yml gen/apple/*.xcodeproj/project.pbxproj \
            || { echo "::error::$ENT is not wired to the target (CODE_SIGN_ENTITLEMENTS)"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.applesignin' "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.applesignin array' \
            -c 'Add :com.apple.developer.applesignin:0 string Default' "$ENT"
          cat "$ENT"

      # The repo's iOS icon set, with the alpha channel flattened: App Store Connect refuses an app
      # icon that has one.
      - name: App icon
        working-directory: packages/desktop/src-tauri
        run: |
          set -euo pipefail
          SET=$(find gen/apple -type d -name AppIcon.appiconset | head -1)
          cp icons/prod/ios/*.png "$SET"/
          for f in "$SET"/*.png; do
            sips -s format jpeg "$f" --out "$RUNNER_TEMP/flat.jpg" >/dev/null
            sips -s format png "$RUNNER_TEMP/flat.jpg" --out "$f" >/dev/null
          done
          sips -g hasAlpha "$SET/AppIcon-512@2x.png"

      # A real IRIS engine on the runner, with one chat in a project folder, so the Simulator build
      # below can be screenshotted CONNECTED (Home, safe area, the chat's folder in the sidebar)
      # before anything reaches TestFlight. Only this job's interface build is pointed at it.
      - name: IRIS engine for the Simulator check
        run: |
          set -euo pipefail
          (cd packages/opencode && bun run script/build.ts --single --skip-install > "$RUNNER_TEMP/engine-build.log" 2>&1) || { tail -40 "$RUNNER_TEMP/engine-build.log"; exit 1; }
          BIN=$(ls packages/opencode/dist/opencode-darwin-arm64/bin/iris)
          PROJECT="$RUNNER_TEMP/Work"; mkdir -p "$PROJECT"
          (cd "$PROJECT" && OPENCODE_SERVER_PASSWORD=sim-check nohup "$BIN" serve --port 4096 --hostname 127.0.0.1 > "$RUNNER_TEMP/engine.log" 2>&1 &)
          ls -la "$BIN"
          up=""
          for i in $(seq 1 120); do curl -sf -o /dev/null -u opencode:sim-check http://127.0.0.1:4096/global/health && { up=1; break; }; sleep 1; done
          if [ -z "$up" ]; then echo "::error::the engine did not answer /global/health in 120 s"; echo "----- engine.log -----"; tail -60 "$RUNNER_TEMP/engine.log"; exit 1; fi
          echo "engine answered after ${i}s"
          curl -sf -u opencode:sim-check -X POST -H 'Content-Type: application/json' -d '{"title":"Simulator check chat"}' "http://127.0.0.1:4096/session?directory=$PROJECT" > /dev/null
          echo "engine up; sessions: $(curl -s -u opencode:sim-check "http://127.0.0.1:4096/api/session?limit=5&order=desc" | head -c 300)"
        env:
          OPENCODE_VERSION: 0.0.0-sim
          OPENCODE_CHANNEL: latest

      - name: Build the interface
        working-directory: packages/desktop
        run: bun run build
        env:
          VITE_IRIS_SIM_ENGINE: http://127.0.0.1:4096
          VITE_IRIS_SIM_PASSWORD: sim-check

      - name: Build for the Simulator
        # Through `tauri ios build`, not xcodebuild: the project's "Build Rust Code" phase calls back
        # into the tauri CLI that started it, and fails when nothing did. The interface is already
        # built (step above), so beforeBuildCommand is skipped.
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/ios-build.log"
          if ! bun run tauri ios build --target aarch64-sim --debug --ci \
               --config '{"build":{"beforeBuildCommand":""}}' > "$LOG" 2>&1; then
            grep -nE 'error(\[E[0-9]+\])?:|error:|Error:|failed|panicked' "$LOG" | head -80
            echo "----- last 120 lines -----"; tail -120 "$LOG"
            exit 1
          fi
          tail -30 "$LOG"
          # tauri copies the finished bundle here ("Finished 1 iOS Bundle at"), not DerivedData.
          APP="$PWD/src-tauri/gen/apple/build/arm64-sim/IRIS.app"
          [ -f "$APP/Info.plist" ] || { echo "no app at $APP"; ls -R src-tauri/gen/apple/build | head -30; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          # A Simulator build carries its entitlements in the binary's __entitlements section.
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          if grep -aq com.apple.developer.applesignin "$APP/$EXE"; then echo "Sign in with Apple entitlement: in the build"
          else echo "::warning::the Simulator build does not carry com.apple.developer.applesignin"; codesign -d --entitlements - "$APP" || true; fi

      - name: Launch in the Simulator and take a screenshot
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone 1[5-7]( Pro)?$"))][0].udid')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 20
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/shots/connected-home.png"
          # Later, once Home's data and the sidebar seeding have settled.
          sleep 25
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/shots/connected-home-settled.png"
          cp "$RUNNER_TEMP/engine.log" "$RUNNER_TEMP/shots/engine.log" || true
          # Still running 20 s after launch = it did not crash on start.
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i "$BUNDLE"

      - name: Upload screenshot and app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            ${{ runner.temp }}/shots/
          if-no-files-found: warn

  # Signed build → App Store Connect → TestFlight. Runs only when asked: a manual run, or a push
  # whose commit message contains [testflight]. Needs, as repository secrets:
  #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (an App Store Connect API key with the Admin role, so
  #   Xcode can create the distribution certificate and profile itself), and APPLE_TEAM_ID.
  # And an app record for io.heyiris.app in App Store Connect, which only a person can create.
  testflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    needs: simulator
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Secrets present
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: ios-device
          save-if: ${{ startsWith(github.ref, 'refs/heads/wt/194511-') || startsWith(github.ref, 'refs/heads/wt/194555-') }}
      - run: command -v xcodegen || brew install xcodegen
      - name: Generate the Xcode project
        working-directory: packages/desktop
        run: bun run tauri ios init --ci
      # Sign in with Apple (#194555, guideline 4.8) needs com.apple.developer.applesignin = [Default]
      # in the app's entitlements. `tauri ios init` generates the iOS target's .entitlements file
      # (and points CODE_SIGN_ENTITLEMENTS at it); the key is added to that file here, because gen/
      # is regenerated on every run. Signing: the CI App Store Connect key has the Admin role and
      # tauri signs automatically with it, which is expected to turn the Sign in with Apple capability
      # on for App ID io.heyiris.app when the profile is made. If it does not, it is one checkbox in
      # the developer portal (Identifiers → io.heyiris.app → Sign in with Apple; handoff #194546).
      - name: Sign in with Apple entitlement
        working-directory: packages/desktop/src-tauri
        run: |
          set -euo pipefail
          find gen/apple -name '*.entitlements' -not -path '*/build/*'
          ENT=$(find gen/apple -name '*.entitlements' -not -path '*/build/*' | head -1)
          if [ -z "$ENT" ]; then
            echo "::error::tauri ios init made no .entitlements file; create it and set CODE_SIGN_ENTITLEMENTS"
            ls -R gen/apple | head -60; exit 1
          fi
          grep -rn "$(basename "$ENT")" gen/apple/project.yml gen/apple/*.xcodeproj/project.pbxproj \
            || { echo "::error::$ENT is not wired to the target (CODE_SIGN_ENTITLEMENTS)"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.applesignin' "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.applesignin array' \
            -c 'Add :com.apple.developer.applesignin:0 string Default' "$ENT"
          cat "$ENT"
      - name: App icon
        working-directory: packages/desktop/src-tauri
        run: |
          set -euo pipefail
          SET=$(find gen/apple -type d -name AppIcon.appiconset | head -1)
          cp icons/prod/ios/*.png "$SET"/
          for f in "$SET"/*.png; do
            sips -s format jpeg "$f" --out "$RUNNER_TEMP/flat.jpg" >/dev/null
            sips -s format png "$RUNNER_TEMP/flat.jpg" --out "$f" >/dev/null
          done
      - name: Build the interface
        working-directory: packages/desktop
        run: bun run build
      # Sign in with Apple must be switched on for io.heyiris.app before Xcode can sign a build that
      # carries the entitlement ("Automatic signing cannot update bundle identifier"). The Admin
      # App Store Connect key can do that through the API: look the App ID up, and add the
      # APPLE_ID_AUTH capability only if it is missing. Idempotent; touches nothing else.
      - name: Sign in with Apple capability on io.heyiris.app
        run: |
          set -euo pipefail
          # The runner's Python is "externally managed" (PEP 668): install into a throwaway venv.
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet "pyjwt[crypto]" requests
          "$RUNNER_TEMP/asc/bin/python" - <<'PY'
          import os, time, jwt, requests
          key = os.environ["ASC_KEY_P8"]
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          api = "https://api.appstoreconnect.apple.com/v1"
          h = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          ids = requests.get(f"{api}/bundleIds", params={"filter[identifier]": "io.heyiris.app", "filter[platform]": "IOS"}, headers=h, timeout=30)
          ids.raise_for_status()
          match = [b for b in ids.json()["data"] if b["attributes"]["identifier"] == "io.heyiris.app"]
          if not match:
              raise SystemExit("io.heyiris.app is not registered as an App ID")
          bid = match[0]["id"]
          caps = requests.get(f"{api}/bundleIds/{bid}/bundleIdCapabilities", headers=h, timeout=30)
          caps.raise_for_status()
          have = {c["attributes"]["capabilityType"] for c in caps.json()["data"]}
          print("capabilities now:", sorted(have))
          if "APPLE_ID_AUTH" in have:
              print("Sign in with Apple: already on")
          else:
              body = {"data": {"type": "bundleIdCapabilities",
                               "attributes": {"capabilityType": "APPLE_ID_AUTH",
                                              "settings": [{"key": "APPLE_ID_AUTH_APP_CONSENT", "options": [{"key": "PRIMARY_APP_CONSENT"}]}]},
                               "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bid}}}}}
              r = requests.post(f"{api}/bundleIdCapabilities", json=body, headers=h, timeout=30)
              if r.status_code >= 300:
                  raise SystemExit(f"could not enable Sign in with Apple: {r.status_code} {r.text[:400]}")
              print("Sign in with Apple: switched on")
          PY

      - name: Build, sign and upload to TestFlight
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          # tauri signs automatically with the App Store Connect key (APPLE_API_*), creating the
          # distribution certificate and profile when they do not exist yet.
          export APPLE_API_KEY="$ASC_KEY_ID" APPLE_API_ISSUER="$ASC_ISSUER_ID" APPLE_API_KEY_PATH="$KEY"
          export APPLE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          LOG="$RUNNER_TEMP/ios-release.log"
          # Every upload needs a new build number; the run number only goes up.
          if ! bun run tauri ios build --export-method app-store-connect --build-number "${{ github.run_number }}" --ci \
               --config '{"build":{"beforeBuildCommand":""}}' > "$LOG" 2>&1; then
            grep -nE 'error(\[E[0-9]+\])?:|error:|Error:|failed|panicked' "$LOG" | head -80
            echo "----- last 120 lines -----"; tail -120 "$LOG"
            exit 1
          fi
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          echo "IPA=$IPA"
          # Without the signed entitlement the Apple sheet fails on the phone: never upload that.
          rm -rf "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - "$RUNNER_TEMP"/ipa/Payload/*.app 2>&1 | tee "$RUNNER_TEMP/ent.txt"
          grep -q com.apple.developer.applesignin "$RUNNER_TEMP/ent.txt" \
            || { echo "::error::the signed build has no Sign in with Apple entitlement"; exit 1; }
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEY"
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing (usually 5–20 minutes)."

  # The desktop app must not notice: the same commit still compiles for macOS.
  desktop-still-compiles:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: desktop-test-aarch64
          save-if: false
      - name: Frontend builds (typecheck + vite)
        working-directory: packages/desktop
        run: bun run build
      # tauri-build checks that every externalBin exists; a stub stands in for the engine.
      - name: cargo check (macOS)
        working-directory: packages/desktop/src-tauri
        run: |
          mkdir -p sidecars && touch sidecars/iris-cli-aarch64-apple-darwin sidecars/iris-mic-aarch64-apple-darwin
          cargo check --locked --target aarch64-apple-darwin
          cargo test --locked --target aarch64-apple-darwin --no-run
          # The phone's PKCE (RFC 7636 Appendix B) and Apple nonce hash (SHA-256 vectors) run here:
          # mobile-only code is not compiled for iOS tests.
          cargo test --locked --target aarch64-apple-darwin --lib -- pkce_tests nonce_tests
