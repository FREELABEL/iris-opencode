name: Release iris2 (preview) and iris on v2 (stable)

# iris2 — IRIS on the opencode v2 engine — ships BESIDE the stable `iris`, never in place of it
# (#188596). Users opt in with `iris iris2 install`; `iris2 upgrade` moves them forward.
#
# Why it cannot disturb stable, checked against the code that ships on main:
#   - main's release.yml fires on `v*` tags. This fires on `iris2-v*`, which `v*` does not match.
#   - `iris update` (installation/pick-release.ts) only accepts tags matching ^v\d+\.\d+\.\d+$,
#     and the installer takes the newest `v*` tag — an iris2 tag is never a candidate.
#   - Assets are `iris2-<os>-<arch>.*`; stable downloads exactly `iris-<os>-<arch>.*`.
#   - Every iris2 release is a PRERELEASE with make_latest=false. GitHub's "latest" is what the
#     Electron desktop download reads (releases/latest/download/IRIS-app-*), so an iris2 release
#     that became latest would 404 that link.
#
# The v1 platform layer is synced from main at build time (packages/cli/script/sync-iris-v1.ts),
# resolved ONCE in `prepare` so every platform builds the same main commit. The release notes
# record which one. Requires main to contain packages/opencode/src/cli/cmd/iris2.ts (the iris2
# updater the front door imports) — the build fails loudly if it does not.
#
# Cut one:  git tag iris2-v1.5.0-beta.1 <commit-on-the-iris2-branch> && git push origin iris2-v1.5.0-beta.1
#
# STABLE (the switch-over, #188596): a bare vX.Y.Z tag (1.5.0 or higher) on this branch builds the
# same binary as the stable `iris` — assets `iris-<os>-<arch>.*`, binary named `iris`, a normal
# (not pre-) release. `iris update` and the installers take the highest `v*` release, so this is
# what every user gets. main's release.yml refuses anything lower once it exists, so a 1.3.x
# cannot take users back. make_latest stays false: GitHub's "latest" is what the Electron desktop
# download links resolve through, and this release carries no desktop assets.
# main's release.yml does NOT fire for these tags: a tag runs the workflows of the commit it
# points at, and this branch has no release.yml.
#   git tag v1.5.0 <commit-on-the-iris2-branch> && git push origin v1.5.0

on:
  push:
    tags:
      - 'iris2-v*'
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-iris2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      name: ${{ steps.v.outputs.name }}
      main_sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Version from tag
        id: v
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == iris2-v* ]]; then
            V="${GITHUB_REF_NAME#iris2-v}"
            # Prerelease semver only: 1.5.0-beta.N. Bare versions are stable and use a v tag.
            if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
              echo "::error::iris2 tags must be iris2-vX.Y.Z-<pre> (e.g. iris2-v1.5.0-beta.1); got $GITHUB_REF_NAME"
              exit 1
            fi
            { echo "version=$V"; echo "channel=preview"; echo "name=iris2"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V="${GITHUB_REF_NAME#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$(printf '%s\n1.5.0\n' "$V" | sort -V | head -1)" != "1.5.0" ]; then
            echo "::error::stable tags on this branch must be vX.Y.Z at or above v1.5.0 (the switch-over); got $GITHUB_REF_NAME"
            exit 1
          fi
          # Same rule as main's release.yml: never publish below the newest CLI release.
          HIGHEST=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate -q '.[] | select(.draft | not) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$HIGHEST" ] && [ "$V" != "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$V" "$HIGHEST" | sort -V | tail -1)" = "$HIGHEST" ]; then
            echo "::error::v$V is below v$HIGHEST, the newest CLI release"
            exit 1
          fi
          { echo "version=$V"; echo "channel=stable"; echo "name=iris"; } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Resolve main
        id: main
        run: |
          set -euo pipefail
          SHA=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          [ -n "$SHA" ] || { echo "::error::could not resolve main"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "v1 platform layer from main @ \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x64
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the main commit to sync from
        shell: bash
        run: git fetch --no-tags origin ${{ needs.prepare.outputs.main_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The bundled web UI is built with vite/rolldown, which needs Node >= 20 (node:util styleText).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Sync the v1 platform layer from main
        shell: bash
        run: |
          set -euo pipefail
          cd packages/cli
          bun script/sync-iris-v1.ts --ref=${{ needs.prepare.outputs.main_sha }}
          test -f src/iris-v1/cli/cmd/iris2.ts || {
            echo "::error::main does not contain packages/opencode/src/cli/cmd/iris2.ts — merge feat/iris2-channel first; iris2 cannot update itself without it"
            exit 1
          }

      # The TUI offers exactly the models IRIS Desktop serves (#188596): take the desktop's own
      # provider file from its release branch rather than trusting the committed copy.
      - name: Model list from IRIS Desktop
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin iris/1.18.23
          git show FETCH_HEAD:packages/desktop/src-tauri/resources/iris-provider.json > packages/cli/src/iris-provider.json
          node -e "const p=require('./packages/cli/src/iris-provider.json'); const n=Object.keys(p.provider.iris.models).length; if(!n) throw new Error('no models'); console.log(n+' models, default '+p.model)"

      - name: Build
        shell: bash
        run: |
          cd packages/cli
          bun run script/build-iris.ts --single --outdir=dist-iris2
        env:
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
          # `iris` keeps the -iris DB suffix the spike used (#187712 I4), so preview users keep
          # their history when this build later becomes the stable `iris`.
          OPENCODE_CHANNEL: iris
          IRIS_CLI_NAME: ${{ needs.prepare.outputs.name }}

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          cd packages/cli/dist-iris2
          # Prefer the plain native variant — on Linux --single can also emit -musl/-baseline.
          EXE=iris; [ "${{ runner.os }}" = "Windows" ] && EXE=iris.exe
          BIN=$(ls -d cli-*/bin/$EXE 2>/dev/null | grep -v -- '-musl' | grep -v -- '-baseline' | head -1 || true)
          [ -n "$BIN" ] || { echo "::error::no binary built"; ls -R .; exit 1; }
          P="$(pwd)/$BIN"
          # Git-bash paths (/d/a/...) mean nothing to the pwsh packaging step (beta.3).
          [ "${{ runner.os }}" = "Windows" ] && P=$(cygpath -w "$P")
          echo "path=$P" >> "$GITHUB_OUTPUT"
          # Stable also ships the musl builds: the installer falls back to them on musl Linux.
          MUSL=$(ls -d cli-*-musl/bin/$EXE 2>/dev/null | grep -v -- '-baseline' | head -1 || true)
          echo "musl=${MUSL:+$(pwd)/$MUSL}" >> "$GITHUB_OUTPUT"

      # The compiled binary must answer as iris2, carry the platform commands, and be able to
      # search its capability index (the v1.3.156 lesson: files read at runtime are not bundled).
      # Run from / so nothing in the build tree can fake a pass.
      - name: Smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="${{ steps.bin.outputs.path }}"
          cd /
          V=$("$BIN" --version)
          [ "$V" = "${{ needs.prepare.outputs.version }}" ] || { echo "::error::--version says '$V'"; exit 1; }
          HELP=$("$BIN" --help)
          echo "$HELP" | head -3
          if [ "${{ needs.prepare.outputs.channel }}" = "preview" ]; then
            echo "$HELP" | grep -q '^iris2 ' || { echo "::error::help does not identify as iris2"; exit 1; }
          else
            ! echo "$HELP" | grep -qi 'preview' || { echo "::error::a stable build must not call itself a preview"; exit 1; }
          fi
          echo "$HELP" | grep -q atlas && echo "$HELP" | grep -q bloq || { echo "::error::platform commands missing from help"; exit 1; }
          "$BIN" find "genesis bespoke html page" --json | grep -q '"matched": [1-9]' || { echo "::error::capability discovery is dead in this build"; exit 1; }
          "$BIN" iris2 --help | grep -q 'install' || { echo "::error::the iris2 updater is not in this build"; exit 1; }
          echo "ok"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          N="${{ needs.prepare.outputs.name }}"
          mkdir -p out pkg
          cp "${{ steps.bin.outputs.path }}" "pkg/$N"
          chmod 755 "pkg/$N"
          if [[ "${{ matrix.target }}" == linux-* ]]; then
            tar -czf "out/$N-${{ matrix.target }}.tar.gz" -C pkg "$N"
            if [ "${{ needs.prepare.outputs.channel }}" = "stable" ] && [ -n "${{ steps.bin.outputs.musl }}" ]; then
              mkdir -p pkg-musl && cp "${{ steps.bin.outputs.musl }}" "pkg-musl/$N" && chmod 755 "pkg-musl/$N"
              tar -czf "out/$N-${{ matrix.target }}-musl.tar.gz" -C pkg-musl "$N"
            fi
          else
            (cd pkg && zip -q "../out/$N-${{ matrix.target }}.zip" "$N")
          fi
          ls -la out

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out, pkg | Out-Null
          $N = "${{ needs.prepare.outputs.name }}"
          Copy-Item "${{ steps.bin.outputs.path }}" "pkg/$N.exe"
          & "pkg/$N.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "$N.exe --version failed" }
          Compress-Archive -Path "pkg/$N.exe" -DestinationPath "out/$N-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.name }}-${{ matrix.target }}
          path: out/*

  release:
    needs: [prepare, build]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Same rule as stable: publish what built, flag what did not, refuse an empty release.
      - name: Verify assets
        id: assets
        run: |
          set -euo pipefail
          MISSING=""
          PRESENT=0
          N="${{ needs.prepare.outputs.name }}"
          for a in $N-darwin-arm64.zip $N-darwin-x64.zip $N-linux-x64.tar.gz $N-linux-arm64.tar.gz $N-windows-x64.zip; do
            if [ -f "artifacts/$a" ]; then PRESENT=$((PRESENT+1)); else MISSING="$MISSING $a"; fi
          done
          [ "$PRESENT" -gt 0 ] || { echo "::error::nothing built — refusing to publish"; exit 1; }
          # Stable replaces every user's `iris`: the four Unix platforms are required, not best-effort.
          if [ "${{ needs.prepare.outputs.channel }}" = "stable" ] && echo "$MISSING" | grep -qE 'darwin|linux'; then
            echo "::error::stable release is missing a required platform:$MISSING"; exit 1
          fi
          if [ -n "$MISSING" ]; then
            echo "::warning::partial iris2 release — missing:$MISSING"
            echo "note=> [!WARNING] Not built for:$MISSING — \`iris iris2 install\` on those platforms reports no asset." >> "$GITHUB_OUTPUT"
          else
            echo "note=" >> "$GITHUB_OUTPUT"
          fi

      # Checksums computed here, from the exact files uploaded. `iris iris2 install` refuses any
      # download that does not match. Basename inside, so `sha256sum -c` works in any directory.
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          for f in *.zip *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          for f in *.zip *.tar.gz; do sha256sum -c "$f.sha256" >/dev/null; done
          { echo '### Checksums'; echo '```'; cat *.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview (prerelease, never latest)
        if: needs.prepare.outputs.channel == 'preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: iris2 v${{ needs.prepare.outputs.version }} (preview)
          draft: false
          prerelease: true
          make_latest: false
          body: |
            **iris2 preview** — IRIS on the opencode v2 engine. Installs beside your stable `iris`, which is not changed.

            ```
            iris iris2 install     # first time
            iris2 upgrade          # later
            iris iris2 remove      # to take it off
            ```

            Platform commands synced from `main` @ `${{ needs.prepare.outputs.main_sha }}`.
            Known gaps: chat history from `iris` does not carry over; you may need to log in once; not every command is verified yet. Tracking: #188596.

            ${{ steps.assets.outputs.note }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable (a normal release; never GitHub's "latest")
        if: needs.prepare.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IRIS Code v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          make_latest: false
          body: |
            **IRIS Code ${{ needs.prepare.outputs.version }} — on the new engine.** Plain `iris` now opens the new TUI. Every `iris` command you use works as before.

            ```
            iris upgrade
            ```

            Your MCP servers (including IRIS OS), agents and commands carry over. Chat history from earlier versions stays where it was and does not appear in the new TUI.

            Platform commands synced from `main` @ `${{ needs.prepare.outputs.main_sha }}`. Tracking: #188596.

            ${{ steps.assets.outputs.note }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
