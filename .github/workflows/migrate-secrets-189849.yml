# ONE-OFF (IP-06 #189849). Copies this repo's release secrets to the private FREELABEL/iris-code.
# GitHub never lets a person read a secret back, but a workflow can use it: each value goes from
# this job's environment straight into `gh secret set` on stdin. Nothing is echoed; GitHub also
# masks every secret in the log. Runs only on this temporary branch, which is deleted afterwards
# together with the MIGRATE_TOKEN secret.
name: migrate-secrets-189849
on:
  push:
    branches: [wt/189849-migrate-secrets]
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy release secrets to FREELABEL/iris-code
        env:
          GH_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fail=0
          for s in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD \
                   APPLE_SIGNING_IDENTITY APPLE_TEAM_ID CROSS_REPO_PAT \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "MISSING  $s (empty here, nothing copied)"; fail=1; continue; fi
            if printf '%s' "${!s}" | gh secret set "$s" --repo FREELABEL/iris-code >/dev/null; then
              echo "copied   $s"
            else
              echo "FAILED   $s"; fail=1
            fi
          done
          exit $fail
