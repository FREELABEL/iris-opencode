name: Release IRIS desktop (Tauri)

# The 1.18 engine port had NO release pipeline. `main` owned release.yml, so every fix that
# landed here was unreleasable by construction -- it could be written, reviewed, merged and
# CI-green while remaining impossible for any client to install. That is not a process gap,
# it is a missing mechanism, and it is what this file is.
#
# TWO DELIBERATE SAFETY PROPERTIES, both learned from shipping something broken:
#
#  1. SEPARATE TAG NAMESPACE (`desktop-v*`, not `v*`). main's release.yml fires on `v*`.
#     Sharing that trigger would mean one tag racing two workflows over the same asset
#     names, with whichever finished last deciding what clients download.
#
#  2. PUBLISHED AS A PRERELEASE. heyiris.io links
#     /releases/latest/download/IRIS-tauri-darwin-*.zip -- and GitHub resolves that to the
#     newest NON-prerelease containing the asset NAME. So an unproven build from this branch
#     physically cannot land on the front page. Promotion is a separate, deliberate act:
#       gh release edit desktop-vX.Y.Z --prerelease=false
#     Verify the artifact FIRST (scripts/verify-shipped-app.sh), then promote.
#
# Asset names match main's convention exactly, so promotion needs no front-end change.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.18.24)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            oc_target: opencode-darwin-arm64
            arch: arm64
          # Intel is NOT optional. A client on an Intel i5 sat on a stale build for weeks
          # because arm64 was the only artifact produced -- the fix existed and had no
          # binary she could run. An architecture with no build is an architecture with
          # no users.
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            oc_target: opencode-darwin-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Stamp the desktop app version
        # tauri.conf.json reads its version from packages/desktop/package.json. When nothing
        # updates that file, every build ships calling itself whatever is checked in -- and a
        # client's crash screen then names a build that was never released, sending you to
        # debug the wrong binary. That cost an hour on 2026-08-27.
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = 'packages/desktop/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('desktop version stamped ->', j.version);
          " "${{ steps.version.outputs.version }}"

      - name: Build the iris CLI (sidecar binary)
        run: |
          cd packages/opencode
          bun run script/build.ts --single
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: latest

      - name: Stage sidecar binary
        # The staged filename MUST match tauri.conf.json's externalBin ("sidecars/iris-cli")
        # and the name lib.rs passes to .sidecar(). All three are asserted below rather than
        # trusted: a mismatch here fails at launch with "program not found", which is exactly
        # how the August 2026 outage presented.
        run: |
          set -euo pipefail
          EXPECT=$(grep -oE '\.sidecar\("[^"]+"\)' packages/desktop/src-tauri/src/lib.rs | head -1 | sed -E 's/.*"(.*)".*/\1/')
          CONF=$(grep -oE '"sidecars/[^"]+"' packages/desktop/src-tauri/tauri.conf.json | head -1 | sed -E 's|"sidecars/(.*)"|\1|')
          echo "lib.rs resolves '$EXPECT'; tauri.conf.json bundles '$CONF'"
          if [ "$EXPECT" != "$CONF" ]; then
            echo "::error::sidecar name mismatch — lib.rs wants '$EXPECT' but externalBin ships '$CONF'. The app would build fine and fail to launch."
            exit 1
          fi
          BIN=$(ls packages/opencode/dist/${{ matrix.oc_target }}/bin/iris)
          mkdir -p packages/desktop/src-tauri/sidecars
          cp "$BIN" "packages/desktop/src-tauri/sidecars/${EXPECT}-${{ matrix.rust_target }}"
          chmod +x "packages/desktop/src-tauri/sidecars/${EXPECT}-${{ matrix.rust_target }}"

      - name: Build IRIS desktop app (Tauri)
        # OPENCODE_CHANNEL must be set HERE, not only on the CLI step. The Tauri build runs
        # vite (beforeBuildCommand), and packages/app/vite.js resolves the channel from this
        # env var — DEFAULTING TO "dev" when it is unset. That default is why every desktop
        # release shipped with a blue DEV badge in the titlebar. "latest" maps to "prod".
        # Sign + notarize when the APPLE_* secrets exist; otherwise fall back to ad-hoc
        # signing. Empty secrets are UNSET rather than exported as "" so the fallback
        # actually triggers instead of codesign dying with "no identity found".
        # Ad-hoc builds ARE flagged "damaged" by Gatekeeper on Apple Silicon -- so an
        # unsigned build reaching a user is a build they cannot open at all.
        run: |
          cd packages/desktop
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "Apple signing secrets present — codesign + notarize enabled."
          else
            echo "::warning::APPLE_CERTIFICATE unset — ad-hoc signing. Gatekeeper will flag this 'damaged' on Apple Silicon."
          fi
          # createUpdaterArtifacts was FALSE on every build this app has ever shipped, so no
          # release carried latest.json and the in-app "Check For Updates..." pointed at a 404.
          # The app had an updater pubkey, a menu item and a UI, with nothing to update from —
          # which is why every fix so far required telling every user to re-download by hand.
          ./node_modules/.bin/tauri build --config ./src-tauri/tauri.prod.conf.json --config '{"bundle":{"createUpdaterArtifacts":true}}' --target ${{ matrix.rust_target }} --bundles app,dmg,updater
        env:
          OPENCODE_CHANNEL: latest
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package .app and .dmg
        # main builds the DMG and then throws it away, uploading only a zipped .app -- so
        # users get a raw bundle with nowhere to drag it. Both are kept here.
        run: |
          set -euo pipefail
          BUNDLE=packages/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle
          cd "$BUNDLE/macos"
          ditto -c -k --sequesterRsrc --keepParent IRIS.app "IRIS-tauri-darwin-${{ matrix.arch }}.zip"
          cd - >/dev/null
          DMG=$(ls "$BUNDLE"/dmg/*.dmg 2>/dev/null | head -1 || true)
          if [ -n "$DMG" ]; then
            cp "$DMG" "$BUNDLE/macos/IRIS-tauri-darwin-${{ matrix.arch }}.dmg"
          else
            echo "::warning::no .dmg produced for ${{ matrix.arch }}"
          fi

      - name: Package the signed updater artifact
        # Tauri names the updater tarball after productName, so BOTH arches produce a file
        # called IRIS.app.tar.gz and the second would clobber the first once the publish job
        # merges them. Rename per-arch before that can happen.
        run: |
          set -euo pipefail
          BUNDLE=packages/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle
          TGZ=$(ls "$BUNDLE"/macos/*.app.tar.gz 2>/dev/null | grep -v 'IRIS-tauri-' | head -1 || true)
          if [ -z "$TGZ" ]; then
            echo "::error::no updater tarball produced — createUpdaterArtifacts did not run"
            exit 1
          fi
          test -f "$TGZ.sig" || { echo "::error::updater tarball is UNSIGNED (TAURI_SIGNING_PRIVATE_KEY missing?)"; exit 1; }
          mv "$TGZ"     "$BUNDLE/macos/IRIS-tauri-darwin-${{ matrix.arch }}.app.tar.gz"
          mv "$TGZ.sig" "$BUNDLE/macos/IRIS-tauri-darwin-${{ matrix.arch }}.app.tar.gz.sig"
          echo "signed updater artifact ✓"

      - name: Smoke-test the bundle we just built
        # Do not wait for a client to discover that the app cannot start. Boot the sidecar
        # straight out of the bundle and parse a real response. Status codes are useless
        # here: every unknown path on that server returns the SPA's index.html with HTTP 200.
        run: |
          set -uo pipefail
          APP=packages/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/IRIS.app
          SIDECAR=$(grep -oE '\.sidecar\("[^"]+"\)' packages/desktop/src-tauri/src/lib.rs | head -1 | sed -E 's/.*"(.*)".*/\1/')
          test -x "$APP/Contents/MacOS/$SIDECAR" || { echo "::error::bundle is missing sidecar '$SIDECAR'"; exit 1; }
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [ "$PLIST" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::bundle reports $PLIST but this release is ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "bundle version $PLIST ✓"
          # An Intel binary cannot execute on the arm64 runner; only boot when native.
          if [ "${{ matrix.arch }}" = "arm64" ] || [ "$(uname -m)" = "x86_64" ]; then
            "$APP/Contents/MacOS/$SIDECAR" serve --port=47999 >/tmp/sc.log 2>&1 &
            for _ in $(seq 1 40); do curl -s -m 2 -o /dev/null http://127.0.0.1:47999/doc && break; sleep 0.5; done
            H=$(curl -s -m 10 http://127.0.0.1:47999/global/health)
            kill %1 2>/dev/null || true
            case "$H" in
              '{'*) echo "health: $H" ;;
              *) echo "::error::/global/health returned the SPA fallback, not JSON — API not serving"; exit 1 ;;
            esac
            echo "$H" | grep -q '"healthy":true' || { echo "::error::engine reports unhealthy"; exit 1; }
            echo "engine healthy ✓"
          else
            echo "cross-arch build — skipping boot test (cannot execute x64 here)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-tauri-darwin-${{ matrix.arch }}
          path: |
            packages/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/IRIS-tauri-darwin-${{ matrix.arch }}.zip
            packages/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/IRIS-tauri-darwin-${{ matrix.arch }}.dmg
            packages/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/IRIS-tauri-darwin-${{ matrix.arch }}.app.tar.gz
            packages/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/IRIS-tauri-darwin-${{ matrix.arch }}.app.tar.gz.sig
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Stamp the desktop app version
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = 'packages/desktop/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('desktop version stamped ->', j.version);
          " "${{ steps.version.outputs.version }}"

      - name: Build the iris CLI (sidecar binary)
        run: |
          cd packages/opencode
          bun run script/build.ts --single
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: latest

      - name: Stage sidecar binary
        run: |
          set -euo pipefail
          EXPECT=$(grep -oE '\.sidecar\("[^"]+"\)' packages/desktop/src-tauri/src/lib.rs | head -1 | sed -E 's/.*"(.*)".*/\1/')
          BIN=$(ls packages/opencode/dist/opencode-windows-x64/bin/iris* | head -1)
          mkdir -p packages/desktop/src-tauri/sidecars
          cp "$BIN" "packages/desktop/src-tauri/sidecars/${EXPECT}-x86_64-pc-windows-msvc.exe"

      # Unsigned: no Windows code-signing certificate exists for this repo. SmartScreen will
      # warn on first run. Tracked, accepted for now.
      - name: Build IRIS desktop app (Tauri)
        # OPENCODE_CHANNEL must be set HERE, not only on the CLI step. The Tauri build runs
        # vite (beforeBuildCommand), and packages/app/vite.js resolves the channel from this
        # env var — DEFAULTING TO "dev" when it is unset. That default is why every desktop
        # release shipped with a blue DEV badge in the titlebar. "latest" maps to "prod".
        run: |
          cd packages/desktop
          ./node_modules/.bin/tauri build --config ./src-tauri/tauri.prod.conf.json --config '{"bundle":{"createUpdaterArtifacts":true}}' --target x86_64-pc-windows-msvc --bundles nsis,updater
        env:
          OPENCODE_CHANNEL: latest
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename installer to the IRIS-tauri-* convention
        run: |
          set -euo pipefail
          NSIS=packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          SRC=$(ls "$NSIS"/*.exe | head -1)
          cp "$SRC" "$NSIS/IRIS-tauri-windows-x64-setup.exe"
          ZIP=$(ls "$NSIS"/*.nsis.zip 2>/dev/null | grep -v 'IRIS-tauri-' | head -1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::no updater zip produced — createUpdaterArtifacts did not run"
            exit 1
          fi
          test -f "$ZIP.sig" || { echo "::error::updater zip is UNSIGNED (TAURI_SIGNING_PRIVATE_KEY missing?)"; exit 1; }
          mv "$ZIP"     "$NSIS/IRIS-tauri-windows-x64.nsis.zip"
          mv "$ZIP.sig" "$NSIS/IRIS-tauri-windows-x64.nsis.zip.sig"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-tauri-windows-x64
          path: |
            packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/IRIS-tauri-windows-x64-setup.exe
            packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/IRIS-tauri-windows-x64.nsis.zip
            packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/IRIS-tauri-windows-x64.nsis.zip.sig
          if-no-files-found: warn

  publish:
    needs: [macos, windows]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=desktop-v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: IRIS-tauri-*
          merge-multiple: true

      - name: Refuse to publish an empty release
        # A release with no assets looks successful in every dashboard and is useless to
        # every user. Fail loudly instead of publishing a shell.
        run: |
          shopt -s nullglob
          assets=(dist/IRIS-tauri-*.zip dist/IRIS-tauri-*.dmg dist/IRIS-tauri-*.exe)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no desktop assets were built — refusing to publish an empty release"
            exit 1
          fi
          ls -la dist/
          printf '%s\n' "${assets[@]}" > /tmp/assets.txt

      - name: Timestamp
        id: pubdate
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build latest.json (the updater manifest)
        # `tauri build --bundles updater` emits the signed tarball and its .sig but NOT the
        # manifest -- that is generated by tauri-action, which this workflow does not use.
        # Without this file the endpoint 404s and "Check For Updates..." is a dead menu item.
        #
        # URLs are pinned to THIS tag, not /latest/. A manifest that points at "latest" would
        # keep resolving forward after a later release, so an old manifest could hand a client
        # a binary whose signature it does not describe.
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          python3 - "$TAG" "$BASE" "${{ steps.version.outputs.version }}" <<'PY'
          import json, os, sys, pathlib
          tag, base, version = sys.argv[1], sys.argv[2], sys.argv[3]
          targets = {
              "darwin-aarch64": "IRIS-tauri-darwin-arm64.app.tar.gz",
              "darwin-x86_64":  "IRIS-tauri-darwin-x64.app.tar.gz",
              "windows-x86_64": "IRIS-tauri-windows-x64.nsis.zip",
          }
          platforms = {}
          for target, asset in targets.items():
              sig = pathlib.Path("dist") / (asset + ".sig")
              if not sig.exists():
                  print(f"::warning::no signature for {target} — that platform cannot auto-update from {tag}")
                  continue
              platforms[target] = {"signature": sig.read_text().strip(), "url": f"{base}/{asset}"}
          if not platforms:
              print("::error::latest.json would list zero platforms — refusing to publish a manifest that updates nobody")
              sys.exit(1)
          manifest = {
              "version": version,
              "notes": f"IRIS Desktop {version}",
              "pub_date": os.environ["PUB_DATE"],
              "platforms": platforms,
          }
          pathlib.Path("dist/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print("latest.json covers:", ", ".join(platforms))
          PY
          cat dist/latest.json
          # The updater assets ship alongside the installers; assets.txt drives the upload.
          shopt -s nullglob
          printf '%s\n' dist/latest.json dist/*.app.tar.gz dist/*.app.tar.gz.sig \
                        dist/*.nsis.zip dist/*.nsis.zip.sig >> /tmp/assets.txt
        env:
          PUB_DATE: ${{ steps.pubdate.outputs.now }}

      - name: Publish as a PRERELEASE
        # Prerelease is load-bearing, not cosmetic: /releases/latest/download resolves to the
        # newest NON-prerelease carrying the asset name, so this cannot reach heyiris.io by
        # accident. Verify, then promote:  gh release edit <tag> --prerelease=false
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # Built with printf, not a heredoc: a heredoc inside a YAML block scalar keeps the
          # YAML indentation in its body, which markdown then renders as a code block.
          printf '%s\n' \
            'Tauri desktop build from the 1.18 engine branch.' \
            '' \
            '**This is a prerelease and is NOT what heyiris.io serves.** The front page' \
            'resolves `/releases/latest/download/` to the newest NON-prerelease, so nothing' \
            'here reaches users until it is deliberately promoted.' \
            '' \
            'To verify, then promote:' \
            '' \
            '```' \
            'ASSET=IRIS-tauri-darwin-arm64.zip scripts/verify-shipped-app.sh' \
            "gh release edit $TAG --prerelease=false" \
            '```' \
            > /tmp/notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "IRIS Desktop ${{ steps.version.outputs.version }}" \
                 --prerelease \
                 --notes-file /tmp/notes.md
          xargs -a /tmp/assets.txt gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Published $TAG (prerelease) with:"
          cat /tmp/assets.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Promote to the landing page ONLY if the published artifact passes verification.
  #
  # Manual promotion had a real failure mode — builds sat unpromoted while a client kept
  # opening the old one — but blanket auto-promotion is worse: seven desktop releases were cut
  # on 2026-08-27 alone, one of them (v1.18.27) carrying only half a change. Pushing all seven
  # to every user would have been the opposite mistake.
  #
  # So the gate is the verifier, not a human remembering. It downloads what the release
  # actually serves, launches the real app under a throwaway HOME, and checks the bundle
  # version, the sidecar name, a parsed /global/health, and that a NEW USER gets iris models.
  # A build that fails any of those stays a prerelease and never reaches the front page.
  #
  # macOS runner because the check launches the .app; the publish job is ubuntu.
  verify-and-promote:
    needs: [publish]
    if: success()
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Get tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=desktop-v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Verify the published artifact
        id: verify
        run: |
          set -uo pipefail
          chmod +x scripts/verify-shipped-app.sh
          ./scripts/verify-shipped-app.sh --tag "${{ steps.version.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote — it passed
        # Only reached when the step above exits 0.
        run: |
          set -euo pipefail
          gh release edit "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "Promoted ${{ steps.version.outputs.tag }} — it is now what heyiris.io serves."

          # The app asks /releases/latest/download/latest.json — an indirection GitHub resolves
          # by asset name to the newest NON-prerelease carrying it. That indirection has already
          # caused three separate outages in this repo, so assert what installed clients will
          # actually receive rather than assuming promotion pointed it here.
          VERSION="${{ steps.version.outputs.version }}"
          for i in $(seq 1 10); do
            LIVE=$(curl -sfL --max-time 20 \
              "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" \
              | python3 -c 'import json,sys;print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            [ "$LIVE" = "$VERSION" ] && break
            echo "  updater endpoint still serving '${LIVE:-nothing}' (want $VERSION) — retry $i"
            sleep 6
          done
          if [ "$LIVE" != "$VERSION" ]; then
            echo "::error::promoted, but the updater endpoint serves '${LIVE:-nothing}' not $VERSION — installed clients will NOT see this release"
            exit 1
          fi
          echo "Updater endpoint serves $VERSION — installed clients will be offered this build ✓"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why it was NOT promoted
        if: failure()
        run: |
          echo "::warning::${{ steps.version.outputs.tag }} FAILED verification and was left as a prerelease. The landing page still serves the previous release, which is the intended outcome — fix the build and cut another tag."
