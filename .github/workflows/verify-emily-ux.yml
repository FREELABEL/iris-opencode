name: verify desktop ux (throwaway)
# The branch's own checks target blacksmith-* runners this org does not have, so PR checks never
# start. This runs the same verification on a GitHub-hosted runner.
on:
  push:
    branches: ["verify/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install
      - name: Typecheck the packages these changes touch
        run: bun turbo typecheck --filter=@opencode-ai/app --filter=@opencode-ai/session-ui --filter=@opencode-ai/ui --filter=opencode 2>&1 | tee /tmp/tc.txt || true
      - name: Baseline, so only NEW errors fail
        run: |
          git worktree add /tmp/base origin/iris/1.18.23
          cd /tmp/base && bun install >/dev/null 2>&1
          (bun turbo typecheck --filter=@opencode-ai/app --filter=@opencode-ai/session-ui --filter=@opencode-ai/ui --filter=opencode 2>&1 || true) | tee /tmp/tc-base.txt
      - name: New type errors only
        run: |
          norm() { grep -E "error TS" "$1" | sed -E 's/\([0-9]+,[0-9]+\)//' | sed -E 's#^[^ ]*/##' | sort -u; }
          norm /tmp/tc.txt > /tmp/h; norm /tmp/tc-base.txt > /tmp/b
          echo "head: $(wc -l < /tmp/h) · base: $(wc -l < /tmp/b)"
          comm -13 /tmp/b /tmp/h | tee /tmp/new.txt
          [ ! -s /tmp/new.txt ] || { echo "::error::new type errors"; exit 1; }
      - name: Unit tests
        run: |
          cd packages/session-ui && bun test src/v2/components/prompt-input/dictation.test.ts
          cd ../app && bun test src/components/status-popover-indicator.test.ts
      - name: Labels the UI asks for must exist
        run: |
          for k in status.dot.healthy status.dot.connecting status.dot.offline status.dot.attention status.dot.issue session.panel.add; do
            grep -q "\"$k\"" packages/app/src/i18n/en.ts || { echo "::error::missing i18n key $k"; exit 1; }
          done
          grep -q '"ui.promptInput.integrations"' packages/ui/src/i18n/en.ts || { echo "::error::missing integrations label"; exit 1; }
          echo "labels present"
      - name: The panel is still reachable now the header button is gone
        run: |
          grep -q "IRIS_SURFACE_CHOICES" packages/app/src/pages/session/session-side-panel.tsx
          grep -q "openIrisSurface" packages/app/src/pages/session/session-side-panel.tsx
          ! grep -q "IRIS — Atlas, agents, leads, pages" packages/app/src/components/session/session-header.tsx
          # at least two places can put "iris" in the tab list (panel menu + chat bar), or it is stranded
          test "$(grep -rl 'tabs().open("iris")' packages/app/src | wc -l)" -ge 2
          echo "panel reachable"
      - name: The integrations entry is wired end to end
        run: |
          grep -q "onIntegrations" packages/session-ui/src/v2/components/prompt-input/index.tsx
          grep -q "requestIrisSurface" packages/app/src/pages/session.tsx
          ! grep -q "onIntegrations" packages/app/src/pages/new-session/new-session-view.tsx
          echo "wired, and absent where it cannot work"
