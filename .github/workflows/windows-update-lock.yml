name: windows-update-lock

# #192439 — Windows updates failed with "Error opening file for writing: ...\IRIS\iris-cli.exe"
# when IRIS was open (its engine, iris-cli.exe, holds the file). This reproduces that on a real
# Windows machine: install version N-1, start its iris-cli.exe so the file is locked, then run
# version N's installer the way the updater does, and check iris-cli.exe was actually replaced.
#
# Two pairs: one from before the 2026-11-03 hardening (expected to FAIL — the control that proves
# the test reproduces the bug) and the current one (expected to PASS).

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'JSON list of {"old":"desktop-v…","new":"desktop-v…","expect":"pass|fail"}'
        required: false
  push:
    branches: ["wt/192439-win-update-lock-test"]
    paths: [".github/workflows/windows-update-lock.yml"]

permissions:
  contents: read

jobs:
  update-while-running:
    strategy:
      fail-fast: false
      matrix:
        pair:
          - { old: desktop-v1.18.165, new: desktop-v1.18.166, expect: fail }
          - { old: desktop-v1.18.173, new: desktop-v1.18.174, expect: pass }
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download both installers
        shell: pwsh
        run: |
          gh release download "${{ matrix.pair.old }}" -R "${{ github.repository }}" -p "IRIS-tauri-windows-x64-setup.exe" -O old.exe
          gh release download "${{ matrix.pair.new }}" -R "${{ github.repository }}" -p "IRIS-tauri-windows-x64-setup.exe" -O new.exe
          Get-Item old.exe, new.exe | Format-Table Name, Length

      - name: Install the old version
        shell: pwsh
        run: |
          $p = Start-Process .\old.exe -ArgumentList "/S" -Wait -PassThru
          "old installer exit: $($p.ExitCode)"
          $dir = Join-Path $env:LOCALAPPDATA "IRIS"
          Get-ChildItem $dir | Format-Table Name, Length, LastWriteTime
          if (-not (Test-Path "$dir\iris-cli.exe")) { throw "old install has no iris-cli.exe in $dir" }
          (Get-FileHash "$dir\iris-cli.exe").Hash | Out-File old-hash.txt

      - name: Open IRIS, as a person does — the app starts its engine and SUPERVISES it
        shell: pwsh
        run: |
          # The real failure (#192439, 1.18.166) was a race: the installer killed iris-cli.exe and
          # the app's engine supervisor respawned it a second later, re-locking the file. A bare
          # engine cannot reproduce that, so the app itself is what we start.
          $dir = Join-Path $env:LOCALAPPDATA "IRIS"
          $app = Start-Process "$dir\IRIS.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          do { Start-Sleep -Seconds 3; $eng = Get-Process iris-cli -ErrorAction SilentlyContinue } while (-not $eng -and (Get-Date) -lt $deadline)
          if ($app.HasExited) { throw "IRIS.exe exited ($($app.ExitCode)) — no app, no supervisor" }
          if (-not $eng) { throw "IRIS.exe is running but never started iris-cli.exe" }
          "IRIS.exe pid $($app.Id) running; its engine iris-cli.exe pid(s): $(($eng | ForEach-Object Id) -join ',')"
          # A SECOND iris-cli.exe the app does not own — an agent's terminal command or a Hive
          # process run from the same folder. The app's own kill never touches it.
          $extra = Start-Process "$dir\iris-cli.exe" -ArgumentList "serve","--port","4778","--hostname","127.0.0.1" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          "extra iris-cli.exe pid $($extra.Id) running: $(-not $extra.HasExited)"
          # Prove the file is really locked before we try the update.
          try { $fs = [System.IO.File]::Open("$dir\iris-cli.exe", "Open", "ReadWrite", "None"); $fs.Close(); throw "iris-cli.exe is NOT locked — the test would prove nothing" }
          catch [System.IO.IOException] { "iris-cli.exe is locked by the running engine (as in the bug report)" }

      - name: Run the new installer the way the updater does
        id: update
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "IRIS"
          "before: IRIS.exe $((Get-Process IRIS -ErrorAction SilentlyContinue | Measure-Object).Count), iris-cli.exe $((Get-Process iris-cli -ErrorAction SilentlyContinue | Measure-Object).Count)"
          $p = Start-Process .\new.exe -ArgumentList "/P" -PassThru   # passive: what the in-app updater uses
          if (-not $p.WaitForExit(300000)) { $p.Kill(); "TIMEOUT"; "result=timeout" >> $env:GITHUB_OUTPUT; exit 0 }
          $old = (Get-Content old-hash.txt).Trim()
          $now = if (Test-Path "$dir\iris-cli.exe") { (Get-FileHash "$dir\iris-cli.exe").Hash } else { "MISSING" }
          $replaced = ($now -ne $old) -and ($now -ne "MISSING")
          "new installer exit: $($p.ExitCode)"
          "iris-cli.exe replaced: $replaced (old $old, now $now)"
          "leftovers: $((Get-ChildItem $dir -Filter '*.old' -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')"
          Get-ChildItem $dir | Format-Table Name, Length, LastWriteTime
          $result = if ($p.ExitCode -eq 0 -and $replaced) { "pass" } else { "fail" }
          "result=$result" >> $env:GITHUB_OUTPUT

      - name: Compare with what this pair should do
        shell: pwsh
        run: |
          $got = "${{ steps.update.outputs.result }}"
          $want = "${{ matrix.pair.expect }}"
          "${{ matrix.pair.old }} -> ${{ matrix.pair.new }} with iris-cli.exe locked: $got (expected $want)"
          if ($got -ne $want) { throw "UNEXPECTED: got $got, expected $want" }
