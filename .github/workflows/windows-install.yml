# Does the Windows installer work on a machine with no Git?
#
# That question had no answer until now. The installer's PowerShell was written and
# tested against pwsh 7 on macOS — a DIFFERENT ENGINE from the Windows PowerShell 5.1
# that actually runs on a client's machine — and the only real Windows box in reach was
# a client's production QuickBooks server, which is not where a first run belongs.
#
# GitHub's windows-latest runner is free on public repos, disposable, and real.
#
# THE POINT IS THE `git` REMOVAL. A runner ships with Git and Node pre-installed, so a
# plain run here proves nothing about the clients who kept hitting "Agent Bridge skipped
# (Git not found)" — it would be the convenient test rather than the real one. The job
# takes Git off PATH first and asserts it is genuinely gone before testing anything.
name: windows-install

on:
  push:
    branches: [main]
    paths: ['install.ps1', 'script/test-install-*.ps1', '.github/workflows/windows-install.yml']
  pull_request:
    paths: ['install.ps1', 'script/test-install-*.ps1', '.github/workflows/windows-install.yml']
  workflow_dispatch:

jobs:
  no-git:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ASCII ONLY in every inline run: block below.
      #
      # The runner writes each `run:` into a .ps1 file with no BOM, and Windows
      # PowerShell 5.1 reads a BOM-less file as ANSI, not UTF-8. An em-dash therefore
      # arrives as mojibake and the parse dies with "Unexpected token" pointing at an
      # innocent word. This job failed exactly that way on its first run -- which is
      # the sort of thing pwsh 7 on macOS will never show you.
      - name: Which PowerShell is this, really?
        shell: powershell           # Windows PowerShell 5.1 -- NOT pwsh 7
        run: |
          "edition: $($PSVersionTable.PSEdition)  version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "expected Windows PowerShell 5.1 -- this job exists to test THAT engine, got $($PSVersionTable.PSVersion)"
          }

      - name: No non-ASCII in executable lines (the thing that broke this job first time)
        shell: powershell
        run: |
          # Windows PowerShell 5.1 reads a BOM-less file as ANSI. A UTF-8 em-dash
          # (E2 80 94) then decodes with a trailing 0x94, which is a CURLY CLOSING
          # QUOTE in cp1252 -- it terminates the string and the parse dies pointing at
          # an innocent word. Same for a check mark (E2 9C 93 -> ends in a left quote).
          # Comments are safe at any byte; executable lines are not.
          $bad = @()
          foreach ($line in (Get-Content ./install.ps1)) {
            if ($line.TrimStart().StartsWith('#')) { continue }
            if ($line -cmatch '[^\x00-\x7F]') { $bad += $line.Trim() }
          }
          if ($bad.Count -gt 0) {
            $bad | Select-Object -First 5 | ForEach-Object { "  $_" }
            throw "$($bad.Count) executable line(s) in install.ps1 contain non-ASCII -- they will break on Windows PowerShell 5.1 when the file is saved without a BOM"
          }
          "install.ps1 executable lines are ASCII"

      - name: No PowerShell-7-only syntax (a parse check will NOT catch this)
        shell: powershell
        run: |
          # 3-argument Join-Path works in pwsh 7 and fails at RUNTIME on 5.1 with
          # "A positional parameter cannot be found that accepts argument ...". It is
          # valid SYNTAX, so the parser is happy and it only fails when the line runs --
          # which is why this is separate from the parse step.
          #
          # ASK THE PARSER, do not pattern-match lines. The first version of this check
          # used a regex and counted a closing paren plus the next argument as a third
          # arg, so the CORRECT nested form `Join-Path (Join-Path $a "..") "b"` tripped
          # it -- it flagged every correct line in the repo, including the ones it had
          # just been added to protect. A guard that cries wolf gets muted, and then it
          # catches nothing at all.
          $hits = @()
          foreach ($f in @('./install.ps1','./script/test-install-fetch.ps1','./script/test-install-autostart.ps1')) {
            $e = $null; $t = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$t, [ref]$e)
            if ($e.Count -gt 0) { $hits += ($f + ": does not parse"); continue }
            $cmds = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] }, $true)
            foreach ($c in $cmds) {
              if ($c.GetCommandName() -ne 'Join-Path') { continue }
              $positional = @($c.CommandElements | Select-Object -Skip 1 |
                Where-Object { $_ -isnot [System.Management.Automation.Language.CommandParameterAst] })
              if ($positional.Count -ge 3) { $hits += ($f + ":" + $c.Extent.StartLineNumber + ": " + $c.Extent.Text) }
            }
          }
          if ($hits.Count -gt 0) { $hits | ForEach-Object { "  " + $_ }; throw "3-argument Join-Path is pwsh 7 only and fails at runtime on Windows PowerShell 5.1" }
          "no 3-argument Join-Path found"

      - name: install.ps1 parses under 5.1
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { $_.Message }; throw "install.ps1 does not parse under Windows PowerShell 5.1" }
          "parsed OK"

      - name: Remove Git from PATH, and PROVE it is gone
        shell: powershell
        run: |
          # Strip every PATH entry containing git, then confirm the command cannot be
          # resolved. Without this assertion the whole job could pass with Git present
          # and tell us nothing -- the failure mode these tests exist to catch.
          $clean = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '(?i)git' }) -join ';'
          "PATH entries: $((($env:PATH -split ';').Count)) -> $((($clean -split ';').Count))"
          echo "PATH=$clean" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Confirm the client condition -- no Git
        shell: powershell
        run: |
          $git = Get-Command git -ErrorAction SilentlyContinue
          if ($git) { throw "Git is STILL on PATH ($($git.Source)) -- this job would be testing the easy case" }
          "git is not available -- this is the client condition"
          # Node must still be here: the daemon needs it, and that is a separate problem.
          $node = Get-Command node -ErrorAction SilentlyContinue
          if (-not $node) { throw "node missing -- the runner image changed; this test needs it" }
          "node: $((node --version))"

      - name: Fetch the daemon with no Git at all
        shell: powershell
        run: |
          . ./script/test-install-fetch.ps1

      - name: Autostart registers a real scheduled task
        shell: powershell
        run: |
          . ./script/test-install-autostart.ps1

      - name: The task really exists in Task Scheduler
        shell: powershell
        run: |
          # The unit tests mock the cmdlets. This asserts the REAL thing landed -- the
          # one claim that has never been made on an actual Windows machine.
          # Extract via the AST. The string-index version here was worse than the one
          # in the test scripts: its "ASCII anchor" was "`n$HasNode", and $HasNode
          # INTERPOLATES to an empty string -- so the anchor collapsed to a bare newline,
          # matched at once, and extracted nothing. A missing function is fatal.
          $e = $null; $t = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1).Path, [ref]$t, [ref]$e)
          if ($e.Count -gt 0) { throw "install.ps1 does not parse: $($e[0].Message)" }
          $fn = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) |
                Where-Object { $_.Name -eq 'Register-IrisAutostart' } | Select-Object -First 1
          if (-not $fn) { throw "Register-IrisAutostart not found in install.ps1 -- refusing to guess" }
          Invoke-Expression $fn.Extent.Text

          $cmd = Join-Path $env:TEMP "iris-daemon.cmd"
          Set-Content -Path $cmd -Value "@echo off`r`necho fake daemon" -Encoding ASCII
          $r = Register-IrisAutostart -DaemonCmd $cmd -TaskName "IRIS Hive Node (CI)"
          if (-not $r.Ok) { throw "registration failed: $($r.Reason)" }
          "method: $($r.Method)"

          if ($r.Method -eq 'scheduled-task') {
            $task = Get-ScheduledTask -TaskName "IRIS Hive Node (CI)" -ErrorAction Stop
            "state: $($task.State)"
            if ($task.Triggers.Count -lt 1) { throw "the task registered with no trigger -- it would never start" }
            # The security property, asserted against the REAL registered task rather
            # than a mock's parameter bag.
            if ($task.Principal.RunLevel -eq 'Highest') { throw "the task registered ELEVATED -- it must run as the user" }
            "trigger: $($task.Triggers[0].CimClass.CimClassName)  runlevel: $($task.Principal.RunLevel)"
            Unregister-ScheduledTask -TaskName "IRIS Hive Node (CI)" -Confirm:$false
            "cleaned up"
          } else {
            "fell back to $($r.Method) -- acceptable, but the scheduled task is the wanted path"
          }
