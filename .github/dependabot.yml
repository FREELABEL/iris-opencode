    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      bun-vscode-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: "/packages/desktop/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      cargo-desktop-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/packages/opencode"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      docker-opencode-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
