[package]
name = "tauri-plugin-iris-web-auth"
version = "0.1.0"
description = "Apple's system sign-in sheet (ASWebAuthenticationSession) for the IRIS iPhone app (#194511)"
edition = "2021"
publish = false
links = "tauri-plugin-iris-web-auth"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
