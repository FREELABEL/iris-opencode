<!doctype html>
<meta charset="utf-8" />
<title>Sign in to IRIS</title>
<!--
  In-app sign-in. Exists so a client never opens a terminal to start using IRIS.

  Mirrors `iris auth login` exactly — two POSTs, no OAuth, no callback server — and writes the
  same ~/.iris/sdk/.env, so signing in here also signs in the CLI.

  Theme follows prefers-color-scheme deliberately: this is a standalone window that owns its
  own document, which is the case where the OS is the right signal. (Inside a Genesis page the
  rule is the opposite — switch on html.dark — because there the HOST owns the theme.)
-->
<style>
  /* IRIS brand tokens (brands/iris-tokens.json) — emerald primary on near-black. The window
     previously used opencode's warm cream palette, which is why it read as someone else's
     product. Committed to dark deliberately: the app it opens over is dark, and the brand
     background token is #000. Every colour is painted explicitly, none inherited. */
  :root {
    --bg: #0a0a0a; --surface: #171717; --elevated: #1a1a1a;
    --line: #262626; --line-lit: #404040;
    --fg: #ffffff; --muted: #a3a3a3; --dim: #737373;
    --primary: #34d399; --primary-dim: #059669; --on-primary: #000000;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 34px 34px 28px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The mark: an iris. It is the aperture that opens to admit light, which is what this
     screen does — the one visual idea here that could not be transplanted onto another
     product. Motion happens ONCE, on arrival: the pupil contracts as light enters. */
  .mark { display: block; width: 76px; height: 76px; margin: 4px auto 22px; }
  .rim  { fill: none; stroke: var(--line-lit); stroke-width: 1.5; }
  .fib  { stroke: var(--primary); stroke-width: 1.9; stroke-linecap: round; opacity: 0;
           animation: fib 620ms ease-out forwards; }
  .fib-s { stroke: var(--primary-dim); stroke-width: 1.5; }
  /* The limbal ring — the darker edge every real iris has. It is what stops 12 spokes
     from reading as a cog. */
  .limbal { fill: none; stroke: var(--primary-dim); stroke-width: 1; opacity: .55; }
  .pupil { fill: var(--bg); stroke: var(--primary-dim); stroke-width: 1;
            transform-origin: 50% 50%; animation: pupil 900ms 220ms cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes fib { to { opacity: .85; } }
  @keyframes pupil { from { transform: scale(1.5); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .fib { animation: none; opacity: .85; }
    .pupil { animation: none; }
  }

  h1 { font-size: 23px; margin: 0 0 7px; letter-spacing: -0.02em; font-weight: 600;
       text-align: center; }
  p.sub { color: var(--muted); margin: 0 0 26px; font-size: 13.5px; text-align: center; }
  label { display: block; font-size: 11px; color: var(--dim); margin: 0 0 8px;
          text-transform: uppercase; letter-spacing: 0.09em; font-weight: 600; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; transition: border-color 120ms, box-shadow 120ms;
  }
  input::placeholder { color: #4d4d4d; }
  /* Mono on the code: it is data, and the digits must not shift as they are typed. */
  input#code { font-family: ui-monospace, "SF Mono", Menlo, monospace;
               letter-spacing: 0.42em; text-align: center; font-size: 20px; padding-left: 0.42em; }
  input:focus { outline: none; border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.16); }
  button {
    width: 100%; margin-top: 18px; padding: 12px; font-size: 15px; font-family: inherit;
    font-weight: 600; color: var(--on-primary); background: var(--primary);
    border: 0; border-radius: 10px; cursor: pointer; transition: background 120ms;
  }
  button:hover:not(:disabled) { background: #6ee7b7; }
  button:disabled { opacity: 0.45; cursor: default; }
  .msg { margin-top: 16px; font-size: 13.5px; min-height: 20px; text-align: center; }
  .err { color: var(--err); }
  .ok  { color: var(--primary); }
  .back { background: none; border: 0; color: var(--muted); font-size: 13px;
          cursor: pointer; margin-top: 14px; padding: 0; width: auto; font-family: inherit; }
  .opt { color: var(--dim); font-weight: 500; text-transform: none; letter-spacing: 0; }
  #promo { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.08em; }
  /* Says what happens when it is left EMPTY. Without that, "optional" reads as
     "optional but probably required" and people hunt for a key nobody sent them. */
  .hint { color: var(--dim); font-size: 12px; line-height: 1.5; margin: 8px 0 0; }
  .back:hover { color: var(--fg); background: none; }
  /* True, and unique to this product: one sign-in covers the app and the CLI. Worth saying
     where someone can act on it, rather than in a doc they will not read. */
  .foot { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line);
          color: var(--dim); font-size: 11.5px; line-height: 1.55; text-align: center; }
</style>

<svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
  <circle class="rim" cx="50" cy="50" r="34" />
  <g>
      <line class="fib" x1="50" y1="17" x2="50" y2="28" transform="rotate(0 50 50)" style="animation-delay:0ms" />
      <line class="fib fib-s" x1="50" y1="19.5" x2="50" y2="27" transform="rotate(30 50 50)" style="animation-delay:35ms" />
      <line class="fib" x1="50" y1="17" x2="50" y2="28" transform="rotate(60 50 50)" style="animation-delay:70ms" />
      <line class="fib fib-s" x1="50" y1="19.5" x2="50" y2="27" transform="rotate(90 50 50)" style="animation-delay:105ms" />
      <line class="fib" x1="50" y1="17" x2="50" y2="28" transform="rotate(120 50 50)" style="animation-delay:140ms" />
      <line class="fib fib-s" x1="50" y1="19.5" x2="50" y2="27" transform="rotate(150 50 50)" style="animation-delay:175ms" />
      <line class="fib" x1="50" y1="17" x2="50" y2="28" transform="rotate(180 50 50)" style="animation-delay:210ms" />
      <line class="fib fib-s" x1="50" y1="19.5" x2="50" y2="27" transform="rotate(210 50 50)" style="animation-delay:245ms" />
      <line class="fib" x1="50" y1="17" x2="50" y2="28" transform="rotate(240 50 50)" style="animation-delay:280ms" />
      <line class="fib fib-s" x1="50" y1="19.5" x2="50" y2="27" transform="rotate(270 50 50)" style="animation-delay:315ms" />
      <line class="fib" x1="50" y1="17" x2="50" y2="28" transform="rotate(300 50 50)" style="animation-delay:350ms" />
      <line class="fib fib-s" x1="50" y1="19.5" x2="50" y2="27" transform="rotate(330 50 50)" style="animation-delay:385ms" />
  </g>
  <circle class="limbal" cx="50" cy="50" r="19" />
  <circle class="pupil" cx="50" cy="50" r="12" />
</svg>

<h1>Sign in to IRIS</h1>
<p class="sub" id="sub">We'll email you a 6-digit code. No password.</p>

<div id="step-email">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@example.com" autofocus />

  <label for="promo" style="margin-top:18px">Start a free trial <span class="opt">optional</span></label>
  <input id="promo" placeholder="Trial code or licence key" autocapitalize="characters" />
  <p class="hint">If someone sent you a key, put it here. Without one you can still sign in and
    use IRIS on the free allowance.</p>

  <button id="send">Send code</button>
</div>

<div id="step-code" hidden>
  <label for="code">6-digit code</label>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" />
  <button id="verify">Sign in</button>
  <button class="back" id="back">Use a different email</button>
</div>

<div class="msg" id="msg"></div>

<p class="foot">Signing in here signs in the <strong>iris</strong> CLI too, then finishes setup
on this machine.</p>

<script>
  const API = "https://raichu.heyiris.io";
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);
  const msg = (t, cls) => { $("msg").textContent = t; $("msg").className = "msg " + (cls || ""); };

  let email = "";

  async function post(path, body) {
    const r = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(body),
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok) throw new Error(data.message || data.error || ("Request failed (" + r.status + ")"));
    return data;
  }

  $("send").onclick = async () => {
    email = $("email").value.trim();
    if (!email) return msg("Enter your email address.", "err");
    // One field takes BOTH a promo code and a licence key — the server tells them apart by
    // shape. Asking a client to know which kind of thing they hold is asking them to
    // understand our billing history.
    const promo = $("promo").value.trim().toUpperCase();
    let trialNote = "";
    $("send").disabled = true;
    msg("Sending…");
    try {
      // Exactly the CLI's payload. `email` alone returns 422 — auto_create is what lets a
      // new client sign in at all, and method/expiration are required by the endpoint.
      const data = await post("/api/v1/auth/send-login-code", {
        email,
        method: "with_login_code",
        expiration_minutes: 30,
        auto_create: true,
        // Only when filled: an empty string is a code the server has to reject, which turns a
        // blank optional field into a visible error.
        ...(promo ? { promo_code: promo } : {}),
      });
      const t = data?.data?.trial;
      trialNote = t?.granted
        ? (t.kind === "license"
            ? `Licence applied — ${t.tier || "your"} plan.`
            : `Trial applied — ${(t.credits || 0).toLocaleString()} credits added.`)
        : (promo ? (t?.error || "That code could not be applied.") : "");
      $("step-email").hidden = true;
      $("step-code").hidden = false;
      $("sub").textContent = "We sent a code to " + email + ".";
      // Say what the key did. One silently ignored is worse than one plainly refused — the
      // client believes they are on a licence and finds out otherwise mid-task.
      if (trialNote) { msg(trialNote, /applied/.test(trialNote) ? "ok" : "err"); } else { msg(""); }
      $("code").focus();
    } catch (e) {
      msg(e.message, "err");
    } finally {
      $("send").disabled = false;
    }
  };

  $("verify").onclick = async () => {
    const code = $("code").value.trim().replace(/\s/g, "");
    if (code.length < 6) return msg("Enter the 6-digit code.", "err");
    $("verify").disabled = true;
    msg("Verifying…");
    try {
      // Same payload the CLI sends, including the 365-day SDK token — so the credential this
      // writes is indistinguishable from one created by `iris auth login`.
      const data = await post("/api/v1/auth/login-with-code", {
        email,
        login_code: code,           // NOT `code` — the endpoint names this field login_code
        generate_sdk_token: true,
        sdk_token_name: "IRIS Desktop",
        sdk_token_expires_days: 365,
        generate_dashboard_url: true,
      });
      // The token is nested: data.data.sdk_token.key. Reading data.sdk_token returns an
      // object, and writing that to the env file would produce "[object Object]" as the
      // credential — a file that exists, passes every "is it signed in" check, and 401s.
      const token = data?.data?.sdk_token?.key;
      if (!token) throw new Error("Signed in, but no token was returned. Contact support.");
      $("step-code").hidden = true;
      $("sub").textContent = "You're signed in on this machine. The iris CLI is signed in too.";

      // Sign-in kicks off the rest of setup (CLI, daemon, registration) in Rust. Follow it
      // here so the window narrates real progress instead of sitting on one static line —
      // and so the restart WAITS for that work to finish rather than racing it.
      const listen = window.__TAURI__.event.listen;
      let settled = false;

      const finish = async (label) => {
        if (settled) return;
        settled = true;
        // Count down visibly. A window that vanishes unannounced reads as a crash; three
        // seconds is long enough to see what happened and still feel automatic.
        for (let n = 3; n > 0; n--) {
          msg(`${label} Restarting in ${n}…`, "ok");
          await new Promise((r) => setTimeout(r, 1000));
        }
        msg("Restarting…", "ok");
        await invoke("restart_app");
      };

      await listen("setup-step", (e) => { if (!settled) msg(e.payload + "…", "ok"); });
      await listen("setup-done", () => finish("Setup complete."));
      await listen("setup-failed", (e) => {
        if (settled) return;
        settled = true;
        // Name the failing step and leave the window open. Restarting over a broken setup
        // would hide the one message that explains what to fix.
        msg(String(e.payload) + " — you are signed in; run `iris daemon install` to finish.", "err");
      });

      msg("Signed in. Finishing setup…", "ok");
      await invoke("save_iris_token", { token });

      // Backstop: if no event ever arrives (older build, dead thread), still finish rather
      // than stranding the user on a dead window — the exact failure this change fixes.
      setTimeout(() => finish("Signed in."), 45000);
    } catch (e) {
      msg(e.message, "err");
    } finally {
      $("verify").disabled = false;
    }
  };

  $("back").onclick = () => {
    $("step-code").hidden = true;
    $("step-email").hidden = false;
    $("sub").textContent = "We'll email you a 6-digit code. No password.";
    msg("");
  };

  $("email").addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });
  $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("verify").click(); });
</script>
