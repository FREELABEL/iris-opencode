<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" width="720" height="790" role="img" aria-labelledby="t d" font-family="'Instrument Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">A rental, from rent to release</title>
  <desc id="d">iris hive rent starts a machine, which shows as starting up until it checks in. Once it checks in it shows as in your hive, and iris hive run sends it work. It is billed the whole time it is up, from rent until iris hive release, which is the only thing that stops the bill.</desc>
  <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="gh" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a3a3a3"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/></marker></defs>
  <rect width="720" height="790" rx="22" fill="#0a0a0a"/><rect x=".5" y=".5" width="719" height="789" rx="22" fill="none" stroke="#262626"/>
  <text x="40" y="58" fill="#737373" font-size="24" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">A RENTAL, FROM RENT TO RELEASE</text>
  <rect x="40" y="128" width="14" height="520" rx="7" fill="#f59e0b"/>
  <line x1="140" y1="150" x2="140" y2="626" stroke="#262626" stroke-width="4"/>
  <line x1="140" y1="310" x2="140" y2="470" stroke="#22d3ee" stroke-width="6"/>
  <g transform="translate(140 150)"><circle r="40" fill="#9333ea"/><path d="M-14 -6 H14 V16 H-14 Z M-9 -6 V-15 H9 V-6" fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linejoin="round"/></g>
  <text x="212" y="146" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">Rent</text>
  <text x="212" y="184" fill="#a3a3a3" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="start">iris hive rent</text>
  <g transform="translate(140 310)"><circle r="40" fill="#111" stroke="#262626" stroke-width="2"/><path d="M0 -26 A26 26 0 0 1 0 26 Z" fill="#a3a3a3"/></g>
  <text x="212" y="306" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">Starting up</text>
  <text x="212" y="344" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">booting, not checked in</text>
  <g transform="translate(140 470)"><circle r="40" fill="#111" stroke="#34d399" stroke-width="4"/><circle r="18" fill="#34d399"/></g>
  <text x="212" y="466" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">In your hive</text>
  <text x="212" y="504" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">checked in · iris hive run</text>
  <g transform="translate(140 626)"><circle r="40" fill="#111" stroke="#262626" stroke-width="2"/><rect x="-15" y="-15" width="30" height="30" rx="3" fill="#fafafa"/></g>
  <text x="212" y="622" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">Release</text>
  <text x="212" y="660" fill="#a3a3a3" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="start">iris hive release</text>
  <text x="40" y="712" fill="#fafafa" font-size="26" font-weight="700" text-anchor="start">Billed the whole time it&#x27;s up.</text>
  <text x="40" y="750" fill="#a3a3a3" font-size="26" font-weight="400" text-anchor="start">Only release stops the bill.</text>

</svg>
