<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" role="img" aria-labelledby="t d" font-family="'Instrument Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How a Hive job travels</title>
  <desc id="d">The old PC connects outward to the IRIS Hive with no open ports. Your laptop sends a job with iris hive run. The Hive hands the job to the old PC, which runs it, and the output comes back to your laptop.</desc>
  <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="gh" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a3a3a3"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/></marker></defs>
  <rect width="720" height="800" rx="22" fill="#0a0a0a"/><rect x=".5" y=".5" width="719" height="799" rx="22" fill="none" stroke="#262626"/>
  <text x="40" y="58" fill="#737373" font-size="24" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">HOW A HIVE JOB TRAVELS</text>
  <g transform="translate(40 96)"><rect width="160" height="150" rx="16" fill="#111" stroke="#262626"/>
  <rect x="26" y="22" width="44" height="106" rx="6" fill="#9333ea"/><circle cx="48" cy="44" r="8" fill="#0a0a0a"/><rect x="36" y="64" width="24" height="5" rx="2.5" fill="#0a0a0a"/><rect x="36" y="76" width="24" height="5" rx="2.5" fill="#0a0a0a"/>
  <path d="M86 128 V78 A44 44 0 0 1 130 34 V128 Z" fill="#22d3ee"/><rect x="86" y="22" width="44" height="8" rx="4" fill="#34d399"/></g>
  <text x="232" y="150" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">The old PC</text>
  <text x="232" y="190" fill="#a3a3a3" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="start">iris hive connect</text>
  <path d="M92 256 L92 352" stroke="#a3a3a3" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ah)"/>
  <path d="M148 352 L148 256" stroke="#22d3ee" stroke-width="4" marker-end="url(#ahg)"/>
  <text x="232" y="296" fill="#a3a3a3" font-size="26"><tspan fill="#fafafa" font-weight="700">1</tspan>  connects outward</text>
  <text x="232" y="328" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">no SSH · no VPN · no open ports</text>
  <text x="232" y="366" fill="#a3a3a3" font-size="26"><tspan fill="#fafafa" font-weight="700">3</tspan>  runs it there</text>
  <polygon points="120.0,368.0 187.5,407.0 187.5,485.0 120.0,524.0 52.5,485.0 52.5,407.0" fill="#111" stroke="url(#g)" stroke-width="4"/>
  <polygon points="120.0,407.0 153.8,426.5 153.8,465.5 120.0,485.0 86.2,465.5 86.2,426.5" fill="url(#g)"/>
  <text x="232" y="440" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">IRIS Hive</text>
  <text x="232" y="478" fill="#a3a3a3" font-size="26" font-weight="400" text-anchor="start">routes the job</text>
  <text x="232" y="512" fill="#a3a3a3" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="start">heyiris.io</text>
  <path d="M148 632 L148 536" stroke="#a3a3a3" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M92 536 L92 632" stroke="#22d3ee" stroke-width="4" marker-end="url(#ahg)"/>
  <text x="232" y="576" fill="#a3a3a3" font-size="26"><tspan fill="#fafafa" font-weight="700">2</tspan>  sends a job</text>
  <text x="232" y="612" fill="#a3a3a3" font-size="26"><tspan fill="#fafafa" font-weight="700">4</tspan>  output back to you</text>
  <g transform="translate(40 640)"><rect x="12" y="10" width="136" height="92" rx="10" fill="#111" stroke="#262626"/><rect x="24" y="22" width="112" height="68" rx="4" fill="#1a1a1a"/>
  <rect x="34" y="34" width="52" height="8" rx="4" fill="#34d399"/><rect x="34" y="50" width="80" height="8" rx="4" fill="#3b82f6"/><rect x="34" y="66" width="38" height="8" rx="4" fill="#d946ef"/>
  <path d="M0 110 H160 L146 126 H14 Z" fill="#262626"/></g>
  <text x="232" y="696" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">Your laptop</text>
  <text x="232" y="736" fill="#a3a3a3" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="start">iris hive run</text>

</svg>
