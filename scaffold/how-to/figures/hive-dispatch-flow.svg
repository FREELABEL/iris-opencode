<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-labelledby="t d" font-family="'Instrument Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How a Hive job travels</title>
  <desc id="d">The old PC connects outward to the IRIS Hive with no open ports. Your laptop sends a job with iris hive run. The Hive hands the job to the old PC, which runs it, and the output comes back to your laptop.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a3a3a3"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1040" height="440" rx="20" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="1039" height="439" rx="20" fill="none" stroke="#262626"/>

  <!-- THE OLD PC: a tower built from flat geometry -->
  <g transform="translate(70 120)">
    <rect width="190" height="200" rx="16" fill="#111" stroke="#262626"/>
    <rect x="28" y="28" width="56" height="144" rx="6" fill="#9333ea"/>
    <circle cx="56" cy="56" r="10" fill="#0a0a0a"/>
    <rect x="40" y="86" width="32" height="6" rx="3" fill="#0a0a0a"/>
    <rect x="40" y="100" width="32" height="6" rx="3" fill="#0a0a0a"/>
    <path d="M108 172 V100 A54 54 0 0 1 162 46 V172 Z" fill="#22d3ee"/>
    <rect x="108" y="28" width="54" height="10" rx="5" fill="#34d399"/>
    <text x="0" y="232" fill="#fafafa" font-size="20" font-weight="700">The old PC</text>
    <text x="0" y="256" fill="#a3a3a3" font-size="15" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">iris hive connect</text>
  </g>

  <!-- THE HIVE: hexagon ring -->
  <g transform="translate(520 210)">
    <polygon points="0,-92 80,-46 80,46 0,92 -80,46 -80,-46" fill="#111" stroke="url(#g)" stroke-width="3"/>
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="url(#g)"/>
    <text x="0" y="128" fill="#fafafa" font-size="20" font-weight="700" text-anchor="middle">IRIS Hive</text>
    <text x="0" y="152" fill="#a3a3a3" font-size="15" text-anchor="middle">routes the job · heyiris.io</text>
  </g>

  <!-- YOUR LAPTOP -->
  <g transform="translate(790 150)">
    <rect x="10" y="0" width="160" height="104" rx="10" fill="#111" stroke="#262626"/>
    <rect x="24" y="14" width="132" height="76" rx="4" fill="#1a1a1a"/>
    <rect x="36" y="30" width="62" height="8" rx="4" fill="#34d399"/>
    <rect x="36" y="46" width="96" height="8" rx="4" fill="#3b82f6"/>
    <rect x="36" y="62" width="44" height="8" rx="4" fill="#d946ef"/>
    <path d="M0 112 H180 L166 128 H14 Z" fill="#262626"/>
    <text x="0" y="168" fill="#fafafa" font-size="20" font-weight="700">Your laptop</text>
    <text x="0" y="192" fill="#a3a3a3" font-size="15" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">iris hive run</text>
  </g>

  <!-- 1. old PC connects OUT (dashed: a standing connection) -->
  <path d="M272 170 C340 150 390 150 432 172" fill="none" stroke="#a3a3a3" stroke-width="2.5" stroke-dasharray="6 7" marker-end="url(#ah)"/>
  <text x="362" y="92" fill="#a3a3a3" font-size="14" text-anchor="middle"><tspan font-weight="700" fill="#fafafa">1</tspan>  connects outward</text>
  <text x="362" y="110" fill="#737373" font-size="13" text-anchor="middle">no SSH · no VPN · no open ports</text>

  <!-- 2. laptop sends the job in -->
  <path d="M782 196 C720 190 660 192 612 202" fill="none" stroke="#a3a3a3" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="700" y="170" fill="#a3a3a3" font-size="14" text-anchor="middle"><tspan font-weight="700" fill="#fafafa">2</tspan>  sends a job</text>

  <!-- 3. Hive hands it to the old PC -->
  <path d="M434 238 C390 262 330 262 278 244" fill="none" stroke="url(#g)" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="356" y="290" fill="#a3a3a3" font-size="14" text-anchor="middle"><tspan font-weight="700" fill="#fafafa">3</tspan>  runs it there</text>

  <!-- 4. output comes back to the laptop -->
  <path d="M600 252 C670 310 730 310 800 280" fill="none" stroke="url(#g)" stroke-width="3" marker-end="url(#ahg)"/>
  <text x="680" y="342" fill="#a3a3a3" font-size="14" text-anchor="middle"><tspan font-weight="700" fill="#fafafa">4</tspan>  output back to you</text>

  <text x="70" y="404" fill="#737373" font-size="13" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">HOW A HIVE JOB TRAVELS</text>
</svg>
