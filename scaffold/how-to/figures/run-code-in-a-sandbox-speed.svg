<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t d" font-family="'Instrument Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">200 checks: 10 sandboxes at a time vs one after another</title>
  <desc id="d">Bar chart. The same 200 checks, each in its own sandbox, took 107.2 seconds running 10 at a time and 663.5 seconds running one after another, 6.2 times as long. All 200 exited 0 both times. Measured 2026-10-11. The limit of 10 at a time was set by us to keep load off the production API, not by Hive.</desc>
  <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="gh" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a3a3a3"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/></marker></defs>
  <rect width="720" height="520" rx="22" fill="#0a0a0a"/><rect x=".5" y=".5" width="719" height="519" rx="22" fill="none" stroke="#262626"/>
  <text x="40" y="58" fill="#737373" font-size="24" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">200 CHECKS, EACH IN ITS OWN SANDBOX</text>
  <text x="40" y="128" fill="#fafafa" font-size="28" font-weight="700" text-anchor="start">10 at a time</text>
  <rect x="40" y="146" width="98.0" height="46" rx="8" fill="url(#gh)"/>
  <text x="154.0" y="179" fill="#fafafa" font-size="26" font-weight="700" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="start">107.2 s</text>
  <text x="40" y="252" fill="#fafafa" font-size="28" font-weight="700" text-anchor="start">One after another</text>
  <rect x="40" y="270" width="606.6" height="46" rx="8" fill="#262626"/>
  <text x="630.6" y="303" fill="#a3a3a3" font-size="26" font-weight="700" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="end">663.5 s</text>
  <line x1="40.0" y1="128" x2="40.0" y2="330" stroke="#1c1c1c"/>
  <text x="40.0" y="362" fill="#737373" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="start">0</text>
  <line x1="222.9" y1="128" x2="222.9" y2="330" stroke="#1c1c1c"/>
  <text x="222.9" y="362" fill="#737373" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="middle">200 s</text>
  <line x1="405.7" y1="128" x2="405.7" y2="330" stroke="#1c1c1c"/>
  <text x="405.7" y="362" fill="#737373" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="middle">400 s</text>
  <line x1="588.6" y1="128" x2="588.6" y2="330" stroke="#1c1c1c"/>
  <text x="588.6" y="362" fill="#737373" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="middle">600 s</text>
  <text x="40" y="414" fill="#fafafa" font-size="26" font-weight="700" text-anchor="start">6.2× faster. All 200 exited 0 both times.</text>
  <text x="40" y="450" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">Measured 2026-10-11. Ten at a time is our</text>
  <text x="40" y="482" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">limit, set to spare the API, not Hive&#x27;s.</text>

</svg>
