<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" width="1040" height="340" role="img" aria-labelledby="t d" font-family="'Instrument Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">200 checks: 10 sandboxes at a time vs one after another</title>
  <desc id="d">Bar chart. The same 200 checks, each in its own sandbox, took 107.2 seconds running 10 at a time and 663.5 seconds running one after another, 6.2 times as long. All 200 exited 0 both times. Measured 2026-10-11. The limit of 10 at a time was set by us to keep load off the production API, not by Hive.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="340" rx="20" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="1039" height="339" rx="20" fill="none" stroke="#262626"/>
  <text x="70" y="44" fill="#737373" font-size="13" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">200 CHECKS, EACH IN ITS OWN SANDBOX</text>

  <!-- scale: 0 → 700 s across 260 → 940 px  (1 s = 0.9714 px) -->
  <g stroke="#1c1c1c" stroke-width="1">
    <line x1="260" y1="80" x2="260" y2="236"/><line x1="454" y1="80" x2="454" y2="236"/>
    <line x1="649" y1="80" x2="649" y2="236"/><line x1="843" y1="80" x2="843" y2="236"/>
  </g>
  <g fill="#737373" font-size="12" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="middle">
    <text x="260" y="256">0</text><text x="454" y="256">200 s</text><text x="649" y="256">400 s</text><text x="843" y="256">600 s</text>
  </g>

  <!-- 10 at a time: 107.2 s → 104 px -->
  <text x="236" y="122" fill="#fafafa" font-size="15" font-weight="700" text-anchor="end">10 at a time</text>
  <rect x="260" y="98" width="104" height="38" rx="6" fill="url(#g)"/>
  <text x="378" y="123" fill="#fafafa" font-size="15" font-weight="700" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">107.2 s</text>

  <!-- one after another: 663.5 s → 644.5 px -->
  <text x="236" y="198" fill="#fafafa" font-size="15" font-weight="700" text-anchor="end">One after another</text>
  <rect x="260" y="174" width="644.5" height="38" rx="6" fill="#262626"/>
  <text x="890" y="199" fill="#a3a3a3" font-size="15" font-weight="700" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">663.5 s</text>

  <text x="70" y="298" fill="#a3a3a3" font-size="13">6.2× faster. All 200 exited 0 both times. Measured 2026-10-11. The limit of 10 at a time is ours (to spare the API), not Hive's.</text>
</svg>
