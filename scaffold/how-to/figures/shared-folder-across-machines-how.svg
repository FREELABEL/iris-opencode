<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" role="img" aria-labelledby="t d" font-family="'Instrument Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">One folder, every machine</title>
  <desc id="d">Every machine in your Hive mounts the same folder at ~/IrisDrive/team. A small file index on one of your Hive machines, reached over your tailnet, keeps the list of files. Your own storage bucket, such as Cloudflare R2 or any S3, holds the contents, and a machine downloads only the parts of a file it reads.</desc>
  <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="gh" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a3a3a3"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/></marker></defs>
  <rect width="720" height="800" rx="22" fill="#0a0a0a"/><rect x=".5" y=".5" width="719" height="799" rx="22" fill="none" stroke="#262626"/>
  <text x="40" y="58" fill="#737373" font-size="24" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" letter-spacing=".04em">ONE FOLDER, EVERY MACHINE</text>
  <g transform="translate(40 96)"><rect width="160" height="150" rx="16" fill="#111" stroke="#262626"/>
  <path d="M24 28 h30 l7 7 h34 v30 h-71 Z" fill="#9333ea"/><path d="M66 58 h30 l7 7 h34 v30 h-71 Z" fill="#3b82f6"/><path d="M24 88 h30 l7 7 h34 v30 h-71 Z" fill="#22d3ee"/></g>
  <text x="232" y="146" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">Every machine</text>
  <text x="232" y="184" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">laptop · server · agent&#x27;s box</text>
  <text x="232" y="220" fill="#a3a3a3" font-size="24" font-weight="400" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" text-anchor="start">~/IrisDrive/team</text>
  <path d="M120 256 L120 352" stroke="#a3a3a3" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ah)"/>
  <text x="232" y="312" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">the list of files</text>
  <g transform="translate(40 360)"><rect width="160" height="150" rx="16" fill="#111" stroke="#262626"/>
  <rect x="30" y="40" width="100" height="12" rx="6" fill="#a3a3a3"/><rect x="30" y="68" width="70" height="12" rx="6" fill="#a3a3a3"/><rect x="30" y="96" width="86" height="12" rx="6" fill="#a3a3a3"/></g>
  <text x="232" y="410" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">The file list</text>
  <text x="232" y="448" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">a small index on one Hive</text>
  <text x="232" y="482" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">machine, over your tailnet</text>
  <path d="M28 176 C0 240 0 600 34 700" fill="none" stroke="url(#g)" stroke-width="4" marker-end="url(#ahg)"/>
  <path d="M120 520 L120 616" stroke="#a3a3a3" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ah)"/>
  <text x="232" y="576" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">says where each file lives</text>
  <g transform="translate(40 624)"><rect width="160" height="150" rx="16" fill="#111" stroke="#262626"/>
  <rect x="36" y="31" width="40" height="40" rx="5" fill="#d946ef"/><rect x="84" y="31" width="40" height="40" rx="5" fill="#3b82f6"/><rect x="36" y="79" width="40" height="40" rx="5" fill="#22d3ee"/><rect x="84" y="79" width="40" height="40" rx="5" fill="#262626"/></g>
  <text x="232" y="674" fill="#fafafa" font-size="32" font-weight="700" text-anchor="start">Your bucket</text>
  <text x="232" y="712" fill="#a3a3a3" font-size="24" font-weight="400" text-anchor="start">R2 or any S3 holds the files</text>
  <text x="232" y="746" fill="#fafafa" font-size="24" font-weight="400" text-anchor="start">only the parts you read move</text>

</svg>
